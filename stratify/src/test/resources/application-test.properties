spring.datasource.driver-class-name=org.testcontainers.jdbc.ContainerDatabaseDriver
spring.datasource.url=jdbc:tc:postgresql:15:///dashboard-test?TC_INITSCRIPT=db/testdata.sql
spring.datasource.username=testuser
spring.datasource.password=test

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:/db/changelog/db.changelog-master.xml
spring.liquibase.contexts=test


# Desativa H2 e ativa configuração via Testcontainers
spring.test.database.replace=none
spring.datasource.driver-class-name=org.testcontainers.jdbc.ContainerDatabaseDriver

# Configurações do Liquibase para testes
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml
spring.liquibase.contexts=test

# Desativa configurações que podem interferir nos testes
spring.main.allow-bean-definition-overriding=true
spring.test.database.replace=any

# Configurações do Hibernate para testes
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Desativa Liquibase para testes
spring.liquibase.enabled=false

# Configurações adicionais de teste
spring.main.banner-mode=off
logging.level.org.springframework.test=INFO
# Garante que o initializer será executado
spring.main.allow-bean-definition-overriding=true

# Configurações do Hibernate para criar o schema
spring.jpa.hibernate.ddl-auto=create-drop